<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GymApp</title>
  <base href="/">
  <!-- viewport-fit=cover SAMO radi VRHA (11.08.2026): u bookmark režimu iOS
       boju status trake čita jednom pri pokretanju, pa promjena teme uživo
       ostavlja pogrešnu boju oko notcha — sada se stranica proteže pod traku
       i HEADER je farba sam, u živoj temi. Dno isto: futer svojom površinom
       boji zonu gestova (--safe-b živ), a ikone drži --footer-gap formula na
       istoj vizuelnoj visini kao prije cover-a. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymApp">
  <link rel="icon" type="image/png" href="assets/j.png">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <link rel="manifest" href="manifest.webmanifest">
  <!-- Podrazumijevano tamna podloga (--void). ThemeService azurira ovu vrijednost
       pri svakoj promjeni teme. -->
  <meta name="theme-color" content="#0C1117">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
