<div class="exercices-wrapper">
  <div class="exercices-container">

    <div class="header">
      <h2>Vježbe</h2>
      <span id="add" class="material-icons" (click)="openCreateModal()">add_box</span>
    </div>

    <p *ngIf="loading">Učitavanje...</p>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <ng-container *ngIf="!loading && !errorMessage">
      <div class="muscle-group-section" *ngFor="let group of groups; let gi = index; trackBy: trackGroup">
        <h3 [style.animation-delay.ms]="groupDelay(gi)">{{ group.name }}</h3>

        <div class="exercice-grid" *ngIf="group.exercices.length > 0; else noExercices">
          <button type="button" class="exercice-card"
                  *ngFor="let ex of group.exercices; let ci = index; trackBy: trackEx"
                  [style.animation-delay.ms]="cardDelay(gi, ci)"
                  (click)="openDetail(ex)">
            <img *ngIf="ex.picture" [src]="getExercicePictureUrl(ex.picture)" [alt]="ex.name">
            <span class="ph" *ngIf="!ex.picture"><i class="material-icons">fitness_center</i></span>
            <h4>{{ ex.name }}</h4>
            <p *ngIf="ex.description">{{ ex.description }}</p>
          </button>
        </div>

        <ng-template #noExercices>
          <p class="no-exercices">Nema vježbi u ovoj grupi.</p>
        </ng-template>
      </div>
    </ng-container>

  </div>
</div>

<div class="modal-overlay" *ngIf="showCreateModal" (click)="closeCreateModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h2>Nova vježba</h2>

    <form (ngSubmit)="onSubmitExercice()" #exerciceForm="ngForm">
      <div class="form-group">
        <label for="exName">Naziv</label>
        <input id="exName" name="exName" type="text" [(ngModel)]="newName" required />
      </div>

      <div class="form-group">
        <label for="exDescription">Opis</label>
        <textarea id="exDescription" name="exDescription" [(ngModel)]="newDescription" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>Slika (opciono)</label>
        <!-- Nativno dugme za fajl se ne može stilizovati — polje je sakriveno,
             a otvara ga dugme u stilu ostatka aplikacije. -->
        <input #exPictureInput hidden type="file" accept="image/*" (change)="onPictureFileSelected($event)" />
        <button type="button" class="file-btn" (click)="exPictureInput.click()">
          <i class="material-icons">add_photo_alternate</i>
          <span class="file-name">{{ newPictureFile?.name ?? 'Dodaj sliku' }}</span>
          <i class="material-icons file-clear" *ngIf="newPictureFile"
             (click)="clearPicture(exPictureInput); $event.stopPropagation()">close</i>
        </button>
        <img *ngIf="newPicturePreviewUrl" [src]="newPicturePreviewUrl" class="picture-preview" alt="Pregled slike">
      </div>

      <div class="form-group">
        <label>Osobine</label>
        <button type="button" class="opt-row" [class.on]="newIsBodyweight"
                (click)="newIsBodyweight = !newIsBodyweight">
          <i class="material-icons">accessibility_new</i>
          <span class="opt-text">Tjelesnom težinom
            <small>zgibovi, sklekovi — kilaža se upisuje samo kad se doda teg</small></span>
          <i class="material-icons opt-state">{{ newIsBodyweight ? 'check_circle' : 'radio_button_unchecked' }}</i>
        </button>
        <button type="button" class="opt-row" [class.on]="newIsUnilateral"
                (click)="newIsUnilateral = !newIsUnilateral">
          <i class="material-icons">pan_tool</i>
          <span class="opt-text">Jednom rukom/nogom
            <small>lijeva i desna strana se prate odvojeno</small></span>
          <i class="material-icons opt-state">{{ newIsUnilateral ? 'check_circle' : 'radio_button_unchecked' }}</i>
        </button>
      </div>

      <div class="form-group">
        <label>Mišićne grupe</label>
        <div class="mg-grid">
          <button
            type="button"
            class="mg-tile"
            *ngFor="let mg of muscleGroups"
            [class.on]="isMuscleGroupSelected(mg.id)"
            (click)="toggleMuscleGroup(mg.id)"
          >
            {{ mg.name }}
            <i class="material-icons" *ngIf="isMuscleGroupSelected(mg.id)">check</i>
          </button>
        </div>
      </div>

      <p *ngIf="createError" class="error">{{ createError }}</p>

      <div class="form-actions">
        <button type="button" class="btn-ghost" (click)="closeCreateModal()">Otkaži</button>
        <button type="submit" class="btn-primary" [disabled]="creating || !exerciceForm.valid">
          {{ creating ? 'Čuvam...' : 'Sačuvaj vježbu' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Detalj vježbe se otvara kroz globalni sloj u ljusci (ExerciceDetailService). -->
