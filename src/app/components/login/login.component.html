<div class="wrapper">
  <div class="auth-container">
    <div class="holder">
      <img class="j" [src]="theme.isLight ? 'assets/logo_light_mode.png' : 'assets/logo.png'" alt="Jeba">
      <h2>Login</h2>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="email">
        <label for="username">Korisničko ime</label>
        <!-- Enter vodi na lozinku, ne pokušava slanje polupopunjene forme -->
        <input id="username" name="username" type="text" [(ngModel)]="username" required
               (keydown.enter)="$event.preventDefault(); passInput.focus()" />
      </div>

      <div class="password">
        <label for="password">Lozinka</label>
        <input #passInput id="password" name="password" type="password" [(ngModel)]="password" required />
      </div>

      <button class="btn" type="submit" [disabled]="!loginForm.valid">
        {{ loading ? 'Prijavljivanje...' : 'Uloguj se' }}
      </button>
    </form>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <a class="registration" routerLink="/register">
      Postani član <span class="jeba">Jebe</span>  
    </a>
  </div>
</div>
