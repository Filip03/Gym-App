<header class="header">
  <button
    type="button"
    class="back"
    *ngIf="backTo"
    (click)="goBack()"
    [attr.aria-label]="'Nazad'"
  >
    <i class="material-icons">arrow_back</i>
  </button>

  <img class="mark" *ngIf="!backTo" src="assets/logo.png" alt="">

  <h1 class="title">{{ title }}</h1>
</header>
